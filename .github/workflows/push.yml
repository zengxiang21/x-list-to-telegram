name: X list to Telegram

on:
  schedule:
    # 每 10 分钟一次，用错峰分钟避开 GitHub Actions 整点/十分高峰，降低触发延迟
    - cron: "3,13,23,33,43,53 * * * *"
    - cron: "8,18,28,38,48,58 * * * *"   # 叠加第二条，等效每 5 分钟一次
  workflow_dispatch: {}       # 允许在 Actions 页面手动触发

concurrency:
  group: x-list-monitor
  cancel-in-progress: false

permissions:
  contents: write             # 用于回写 state.json

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          LIST_ID: ${{ secrets.LIST_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          git diff --cached --quiet || (git commit -m "chore: update state [skip ci]" && git push)
